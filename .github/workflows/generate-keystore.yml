name: Generate release keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASS" ]; then
            echo "::error::请先在仓库 Settings > Secrets and variables > Actions 中配置 KEYSTORE_PASSWORD 和 KEY_ALIAS"
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore ccmark-release.keystore \
            -alias "${KEY_ALIAS:-ccmark}" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -dname "CN=ccmark, OU=ccmark, O=ccmark, L=Internet, ST=Internet, C=CN"

      - name: Base64 encode
        run: base64 -w0 ccmark-release.keystore > keystore_base64.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccmark-release-keystore
          path: |
            ccmark-release.keystore
            keystore_base64.txt
          if-no-files-found: error
